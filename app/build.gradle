plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bookreader'
    compileSdk 36

    defaultConfig {
        applicationId "com.bookreader"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.activity:activity:1.8.2"
    implementation "androidx.coordinatorlayout:coordinatorlayout:1.2.0"

    // Room — used by data/AppDatabase.java and the DAOs
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    implementation "org.readium.kotlin-toolkit:readium-shared:3.3.0"
    implementation "org.readium.kotlin-toolkit:readium-streamer:3.3.0"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
